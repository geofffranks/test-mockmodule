name: testsuite

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:

  # a cheap and easy job to avoid checking all Perl versions
  ubuntu:
    env:
      PERL_USE_UNSAFE_INC: 0
      AUTHOR_TESTING: 1
      AUTOMATED_TESTING: 1
      RELEASE_TESTING: 1

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: shogo82148/actions-setup-perl@v1
      - run: perl -V
      # Reads ALL deps (configure / runtime / test) from META.json /
      # Build.PL. cpanm honors configure_requires automatically, so
      # Module::Build gets pulled in before perl Build.PL runs.
      # Single source of truth -- adding a new dep to Build.PL picks
      # up here without a workflow edit.
      #
      # --with-recommends pulls the optional Moose/Mouse/Class::Load/
      # Test::Exception deps (declared as `recommends` in Build.PL, GH
      # #90). Without it the t/moose_*.t and t/mouse_*.t MOP-integration
      # tests would silently skip_all and CI would stop exercising the
      # GH #55 meta-class code paths.
      #
      # Test::Perl::Critic is an author-only dep used by
      # t/author-perlcritic.t; installed explicitly so the lint test
      # runs in CI under AUTHOR_TESTING=1.
      - name: install dependencies
        run: |
          cpanm --with-recommends --installdeps --notest .
          cpanm --notest Test::Perl::Critic Perl::Critic
      - run: perl Build.PL
      - run: ./Build
      - run: ./Build test

  perl-versions:
    runs-on: ubuntu-latest
    name: List Perl versions
    outputs:
      perl-versions: ${{ steps.action.outputs.perl-versions }}
    steps:
      - id: action
        uses: perl-actions/perl-versions@v2
        with:
          since-perl: v5.10
          with-devel: true

  perl:
    env:
      # some plugins still needs this to run their tests...
      PERL_USE_UNSAFE_INC: 0
      AUTHOR_TESTING: 1
      AUTOMATED_TESTING: 1
      RELEASE_TESTING: 1

    runs-on: ubuntu-latest

    needs: [ubuntu, perl-versions]

    strategy:
      fail-fast: false
      matrix:
        perl-version: ${{ fromJson(needs.perl-versions.outputs.perl-versions) }}

    container:
      image: perldocker/perl-tester:${{ matrix.perl-version }}

    steps:
      - uses: actions/checkout@v6
      - run: perl -V
      # perldocker/perl-tester images ship with cpanm + Module::Build
      # preinstalled, so no bootstrap step needed. Same `cpanm
      # --with-recommends --installdeps` pattern as the ubuntu job;
      # reads Build.PL directly. Avoids dep-list duplication between
      # workflow + Build.PL. --with-recommends ensures the optional
      # Moose/Mouse test deps (GH #90) install so the MOP-integration
      # tests run instead of skipping.
      - name: install dependencies
        run: cpanm --with-recommends --installdeps --notest .
      - run: perl Build.PL
      - run: ./Build
      - run: ./Build test

  # Exercises every optional-OO-dependency permutation -- the full
  # {Moo, Moose, Mouse} cross-product (8 profiles) -- so each OO system is
  # tested in isolation and in combination. Uses a clean setup-perl Perl
  # (NOT the perl-tester container, which preloads Moose and would defeat the
  # `none`/`moo`/`mouse` profiles) and installs each profile's modules
  # explicitly (no --with-recommends). The `moo` profile -- Moo present, Moose
  # absent -- is the configuration that reproduces GH #93. Support deps are
  # paired with the systems whose tests need them: Class::Load + Test::Exception
  # for the Moose tests (t/moose_around.t needs Class::Load), Test::Exception
  # for t/mouse_basic.t. Tests for an absent system skip_all, so a profile only
  # installs what it actually exercises.
  oo-deps:
    name: oo-deps (${{ matrix.profile.name }})
    env:
      PERL_USE_UNSAFE_INC: 0
      AUTOMATED_TESTING: 1

    runs-on: ubuntu-latest

    needs: [ubuntu]

    strategy:
      fail-fast: false
      matrix:
        profile:
          - name: none
            install: ""
          - name: moo
            install: "Moo"
          - name: moose
            install: "Moose Class::Load Test::Exception"
          - name: mouse
            install: "Mouse Test::Exception"
          - name: moo+moose
            install: "Moo Moose Class::Load Test::Exception"
          - name: moo+mouse
            install: "Moo Mouse Test::Exception"
          - name: moose+mouse
            install: "Moose Mouse Class::Load Test::Exception"
          - name: all
            install: "Moo Moose Mouse Class::Load Test::Exception"

    steps:
      - uses: actions/checkout@v6
      - uses: shogo82148/actions-setup-perl@v1
      - run: perl -V
      # Required deps only -- NO --with-recommends, so the optional OO modules
      # are controlled per-profile below.
      - name: install required dependencies
        run: cpanm --installdeps --notest .
      - name: install OO profile dependencies
        if: matrix.profile.install != ''
        run: cpanm --notest ${{ matrix.profile.install }}
      - run: perl Build.PL
      - run: ./Build
      - run: ./Build test
